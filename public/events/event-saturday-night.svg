<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1a6cf0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a6cf0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg3)"/>
  <rect width="600" height="800" fill="url(#glow3)"/>
  <!-- Neon blue accents -->
  <ellipse cx="300" cy="0" rx="200" ry="250" fill="#2060ff" opacity="0.05"/>
  <line x1="0" y1="580" x2="600" y2="580" stroke="#1a6cf0" stroke-width="0.5" opacity="0.3"/>
  <!-- Equalizer bars (decorative) -->
  <g opacity="0.15" fill="#1a6cf0">
    <rect x="60"  y="620" width="14" height="80"/>
    <rect x="82"  y="640" width="14" height="60"/>
    <rect x="104" y="600" width="14" height="100"/>
    <rect x="126" y="650" width="14" height="50"/>
    <rect x="148" y="615" width="14" height="85"/>
    <rect x="440" y="630" width="14" height="70"/>
    <rect x="462" y="605" width="14" height="95"/>
    <rect x="484" y="645" width="14" height="55"/>
    <rect x="506" y="620" width="14" height="80"/>
    <rect x="528" y="660" width="14" height="40"/>
  </g>
  <!-- DJ icon (turntable) -->
  <circle cx="300" cy="175" r="45" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="175" r="10" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="130" x2="330" y2="155" stroke="#C9A84C" stroke-width="1.5" opacity="0.6"/>
  <!-- Text -->
  <text x="300" y="320" text-anchor="middle" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#F5F5F0" letter-spacing="4">SATURDAY</text>
  <text x="300" y="375" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#F5F5F0" letter-spacing="6">NIGHT</text>
  <line x1="180" y1="400" x2="420" y2="400" stroke="#C9A84C" stroke-width="0.8"/>
  <text x="300" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#C9A84C" letter-spacing="4">DJ ZIAD TOUBIA</text>
  <text x="300" y="460" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#C9A84C" letter-spacing="3" opacity="0.6">COMMERCIAL · TOP 40</text>
  <text x="300" y="745" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#ffffff" letter-spacing="2" opacity="0.4">SAT · 10 PM – 3 AM</text>
</svg>
