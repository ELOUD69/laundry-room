<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fffff0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fffff0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg1)"/>
  <rect width="600" height="800" fill="url(#spot)"/>
  <!-- White spotlights -->
  <ellipse cx="200" cy="0" rx="120" ry="300" fill="#ffffff" opacity="0.04"/>
  <ellipse cx="400" cy="0" rx="100" ry="280" fill="#ffffff" opacity="0.03"/>
  <!-- Gold accent lines -->
  <line x1="0" y1="760" x2="600" y2="760" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
  <!-- Event text -->
  <text x="300" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="64" font-weight="bold" fill="#F5F5F0" opacity="0.95" letter-spacing="6">WHITE</text>
  <text x="300" y="410" text-anchor="middle" font-family="Georgia,serif" font-size="64" font-weight="bold" fill="#F5F5F0" opacity="0.95" letter-spacing="6">PARTY</text>
  <line x1="200" y1="440" x2="400" y2="440" stroke="#C9A84C" stroke-width="1"/>
  <text x="300" y="470" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#C9A84C" letter-spacing="4">MERHI SERHAN</text>
  <text x="300" y="500" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#C9A84C" letter-spacing="3" opacity="0.6">HOUSE · R&amp;B</text>
  <!-- Small logo -->
  <circle cx="300" cy="180" r="40" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <text x="300" y="188" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#C9A84C" letter-spacing="3">KAI</text>
  <!-- Footer info -->
  <text x="300" y="720" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#C9A84C" letter-spacing="2" opacity="0.7">ALL WHITE DRESS CODE</text>
  <text x="300" y="745" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#ffffff" letter-spacing="2" opacity="0.4">FRI · 10 PM – 3 AM</text>
</svg>
