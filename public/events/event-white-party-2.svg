<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1810"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="glow4" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg4)"/>
  <rect width="600" height="800" fill="url(#glow4)"/>
  <!-- Light beams -->
  <polygon points="300,0 240,0 100,800 160,800" fill="#ffffff" opacity="0.02"/>
  <polygon points="300,0 360,0 500,800 440,800" fill="#ffffff" opacity="0.02"/>
  <!-- Gold sparkles -->
  <text x="80"  y="200" font-family="serif" font-size="16" fill="#C9A84C" opacity="0.5">✦</text>
  <text x="500" y="180" font-family="serif" font-size="12" fill="#C9A84C" opacity="0.4">✦</text>
  <text x="530" y="320" font-family="serif" font-size="8"  fill="#C9A84C" opacity="0.3">✦</text>
  <text x="50"  y="360" font-family="serif" font-size="10" fill="#C9A84C" opacity="0.3">✦</text>
  <!-- Vol.2 badge -->
  <circle cx="300" cy="160" r="42" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
  <text x="300" y="156" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#C9A84C" letter-spacing="2" opacity="0.8">VOL.</text>
  <text x="300" y="175" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="#C9A84C">II</text>
  <!-- Text -->
  <text x="300" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="64" font-weight="bold" fill="#F5F5F0" opacity="0.95" letter-spacing="6">WHITE</text>
  <text x="300" y="400" text-anchor="middle" font-family="Georgia,serif" font-size="64" font-weight="bold" fill="#F5F5F0" opacity="0.95" letter-spacing="6">PARTY</text>
  <line x1="200" y1="428" x2="400" y2="428" stroke="#C9A84C" stroke-width="0.8"/>
  <text x="300" y="456" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#C9A84C" letter-spacing="4">MERHI SERHAN</text>
  <text x="300" y="484" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#C9A84C" letter-spacing="3" opacity="0.6">DEEP HOUSE · AFROBEATS</text>
  <text x="300" y="745" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#ffffff" letter-spacing="2" opacity="0.4">FRI · 10 PM – 3 AM</text>
</svg>
